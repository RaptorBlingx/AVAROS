# PREVENTION Analytics Platform — Docker Compose (Dev Mode)
#
# Deploys PREVENTION + MongoDB for AVAROS integration.
# Keycloak auth is bypassed via noauth overlay for development.
#
# Architecture: 2 containers
#   - prevention:       GraphQL analytics platform (Flask + Graphene)
#   - prevention-mongo: MongoDB data store
#
# Usage:
#   docker compose -f docker/docker-compose.prevention.yml up -d --build

services:
  prevention-mongo:
    container_name: prevention-mongo
    hostname: prevention-mongo
    image: mongo:7
    restart: unless-stopped

    networks:
      - prevention

    environment:
      MONGO_INITDB_ROOT_USERNAME: prevention
      MONGO_INITDB_ROOT_PASSWORD: prevention

    volumes:
      - prevention_mongodata:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prevention:
    container_name: prevention
    hostname: prevention
    build:
      context: ${PREVENTION_REPO_PATH:-/home/ubuntu/prevention_upd}
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "app.py"]

    depends_on:
      prevention-mongo:
        condition: service_healthy

    networks:
      - prevention

    ports:
      - "${PREVENTION_PORT:-8082}:8081"

    environment:
      - MONGO_HOST=prevention-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${PREVENTION_MONGO_USER:-prevention}
      - MONGO_PASS=${PREVENTION_MONGO_PASS:-prevention}
      - ADDONS=avaros

    volumes:
      # No-auth overlay — replaces core/__init__.py to bypass Keycloak
      - ./prevention_init_noauth.py:/core/__init__.py:ro
      # Mount AVAROS addon into PREVENTION's addons directory
      - ../tools/prevention-addon:/addons/avaros:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  prevention:
    driver: bridge

volumes:
  prevention_mongodata:
    driver: local
