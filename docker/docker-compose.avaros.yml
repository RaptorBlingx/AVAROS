# AVAROS Skill Docker Compose Configuration
# 
# This compose file deploys AVAROS as a separate container that joins the
# WASABI OVOS network (per DEC-010). The skill connects to the OVOS message
# bus and uses UnconfiguredAdapter by default until platform is set up.
#
# Usage:
#   docker compose -f docker-compose.avaros.yml up -d
#   docker compose -f docker-compose.avaros.yml logs -f

services:
  avaros_db:
    container_name: avaros_db
    hostname: avaros_db
    image: postgres:15-alpine
    restart: unless-stopped

    networks:
      - ovos

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avaros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avaros}
      POSTGRES_DB: avaros

    volumes:
      - avaros_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avaros}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  avaros_skill:
    container_name: avaros_skill
    hostname: avaros_skill
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped

    depends_on:
      avaros_db:
        condition: service_healthy
    
    # Join WASABI OVOS network
    networks:
      - ovos

    # Mount WASABI OVOS shared volumes and skill code
    volumes:
      # WASABI OVOS config (read-write for skill settings)
      - ../../wasabi-ovos/ovos/config:/home/ovos/.config/mycroft:rw
      
      # WASABI OVOS tmp directory (read-write)
      - ../../wasabi-ovos/ovos/tmp:/tmp/mycroft:rw
      
      # Mount skill code for hot-reload during development
      - ../skill:/opt/avaros/skill:ro

      # Mount PREVENTION export data so runtime status can inspect freshness
      - ../tools/prevention-addon/data:/opt/avaros/tools/prevention-addon/data:ro
      
      # Mount locale files (intents & dialogs)
      - ../skill/locale:/opt/avaros/skill/locale:ro
      
      # Logs directory (persistent)
      - ./logs:/opt/avaros/logs:rw
    
    # Environment configuration
    environment:
      # Adapter: configured via Web UI (SettingsService), not env vars.
      # ADAPTER_TYPE is kept for documentation only.
      - ADAPTER_TYPE=

      # OVOS messagebus endpoint (used by launch_skill.py)
      - MESSAGEBUS_HOST=${MESSAGEBUS_HOST:-ovos_messagebus}
      - MESSAGEBUS_PORT=${MESSAGEBUS_PORT:-8181}
      
      # Database configuration (PostgreSQL — production-grade)
      - AVAROS_DATABASE_URL=postgresql://${POSTGRES_USER:-avaros}:${POSTGRES_PASSWORD:-avaros}@avaros_db:5432/avaros
      
      # Logging configuration
      - LOG_LEVEL=INFO
      - AVAROS_LOG_LEVEL=INFO

      # PREVENTION analytics (optional — disabled when URL is empty)
      - PREVENTION_URL=${PREVENTION_URL:-}
      - PREVENTION_AUTH_TOKEN=${PREVENTION_AUTH_TOKEN:-}
      - PREVENTION_DATA_MAX_AGE_MINUTES=${PREVENTION_DATA_MAX_AGE_MINUTES:-1440}
      - PREVENTION_EXPORT_MANIFEST_PATH=/opt/avaros/tools/prevention-addon/data/export_manifest.json
      - WAKEWORD_BACKEND_URL=${WAKEWORD_BACKEND_URL:-http://avaros-wakeword:9999}

      # OVOS configuration
      - OVOS_CONFIG_BASE_FOLDER=mycroft
      - OVOS_CONFIG_FILENAME=mycroft.conf
      
      # Python environment
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    
    # Health check: verify skill is running
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://avaros-web-ui:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    
    # Resource limits (optional, adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  avaros-web-ui:
    container_name: avaros-web-ui
    hostname: avaros-web-ui
    build:
      context: ..
      dockerfile: web-ui/Dockerfile
    restart: unless-stopped

    depends_on:
      avaros_db:
        condition: service_healthy
      avaros-wakeword:
        condition: service_healthy

    networks:
      - ovos

    # Web UI is only accessible via avaros-proxy (HTTPS)
    # For direct HTTP access in dev, use docker-compose.dev.yml override
    expose:
      - "8080"

    volumes:
      - ../skill:/opt/avaros/skill:ro
      - ../tools/prevention-addon/data:/opt/avaros/tools/prevention-addon/data:ro

    env_file:
      - ../.env

    environment:
      - AVAROS_DATABASE_URL=postgresql://${POSTGRES_USER:-avaros}:${POSTGRES_PASSWORD:-avaros}@avaros_db:5432/avaros
      - AVAROS_WEB_UI_PORT=8080
      - PREVENTION_URL=${PREVENTION_URL:-}
      - PREVENTION_AUTH_TOKEN=${PREVENTION_AUTH_TOKEN:-}
      - PREVENTION_DATA_MAX_AGE_MINUTES=${PREVENTION_DATA_MAX_AGE_MINUTES:-1440}
      - PREVENTION_EXPORT_MANIFEST_PATH=/opt/avaros/tools/prevention-addon/data/export_manifest.json
      # HiveMind voice config: passed via env_file (.env) — do NOT redeclare
      # here or compose defaults will override the .env values.
      # Voice .env vars: HIVEMIND_WS_URL=auto is recommended behind the
      # AVAROS proxy; HIVEMIND_CLIENT_KEY and HIVEMIND_CLIENT_SECRET/crypto
      # key must match the HiveMind client database.
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  avaros-prevention-exporter:
    container_name: avaros-prevention-exporter
    hostname: avaros-prevention-exporter
    build:
      context: ..
      dockerfile: tools/prevention-data-sync/Dockerfile
    restart: unless-stopped
    user: "${AVAROS_SHARED_DB_UID:-1000}:${AVAROS_SHARED_DB_GID:-1000}"

    depends_on:
      avaros_db:
        condition: service_healthy

    networks:
      - ovos

    env_file:
      - ../.env

    environment:
      - AVAROS_DATABASE_URL=postgresql://${POSTGRES_USER:-avaros}:${POSTGRES_PASSWORD:-avaros}@avaros_db:5432/avaros
      - PREVENTION_EXPORT_OUTPUT=/opt/avaros/tools/prevention-addon/data
      - PREVENTION_EXPORT_DAYS=${PREVENTION_EXPORT_DAYS:-30}
      - PREVENTION_EXPORT_INTERVAL_SECONDS=${PREVENTION_EXPORT_INTERVAL_SECONDS:-900}
      - PREVENTION_EXPORT_PROFILE=${PREVENTION_EXPORT_PROFILE:-}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    command:
      [
        "sh",
        "-c",
        "case \"$${PREVENTION_EXPORT_ENABLED:-true}\" in false|False|0|no|NO) echo 'PREVENTION exporter disabled'; tail -f /dev/null ;; *) python /opt/avaros/tools/prevention-data-sync/exporter.py --daemon --platform generic_rest --days \"$${PREVENTION_EXPORT_DAYS:-30}\" --interval \"$${PREVENTION_EXPORT_INTERVAL_SECONDS:-900}\" --output \"$${PREVENTION_EXPORT_OUTPUT:-/opt/avaros/tools/prevention-addon/data}\" ;; esac",
      ]

    volumes:
      - ../tools/prevention-addon/data:/opt/avaros/tools/prevention-addon/data:rw

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  avaros-wakeword:
    container_name: avaros-wakeword
    hostname: avaros-wakeword
    build:
      context: ../services/wakeword
    restart: unless-stopped
    ports:
      - "${WAKEWORD_PORT:-9999}:9999"
    volumes:
      # Optional: mount custom model directory for trained wake-word models
      - ${WAKEWORD_MODELS_DIR:-../services/wakeword/models}:/app/models
    environment:
      - WAKEWORD_MODEL=${WAKEWORD_MODEL:-hey_jarvis}
      - WAKEWORD_MODEL_PATH=${WAKEWORD_MODEL_PATH:-}
      - WAKEWORD_MODEL_LABEL=${WAKEWORD_MODEL_LABEL:-hey_jarvis}
      - WAKEWORD_PRELOAD_MODELS=${WAKEWORD_PRELOAD_MODELS:-1}
      # Lower threshold and 2-frame confirmation reduce missed wake detections.
      - WAKEWORD_THRESHOLD=${WAKEWORD_THRESHOLD:-0.25}
      - WAKEWORD_CONFIRMATION_FRAMES=${WAKEWORD_CONFIRMATION_FRAMES:-1}
      - WAKEWORD_DETECTION_COOLDOWN_SECONDS=${WAKEWORD_DETECTION_COOLDOWN_SECONDS:-1.2}
    networks:
      - ovos
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')",
        ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  certbot:
    container_name: avaros-certbot
    hostname: avaros-certbot
    image: certbot/certbot:latest
    restart: "no"

    networks:
      - ovos

    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt_certs:/etc/letsencrypt
      - ./certbot-renew.sh:/opt/avaros/certbot-renew.sh:ro

    environment:
      - LETSENCRYPT_DOMAIN=${LETSENCRYPT_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@localhost}

    command:
      [
        "/bin/sh",
        "-c",
        "if [ -z \"$${LETSENCRYPT_DOMAIN}\" ]; then echo 'LETSENCRYPT_DOMAIN not set; skipping certificate acquisition'; exit 0; fi; certbot certonly --webroot -w /var/www/certbot --cert-name avaros --email $${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email --non-interactive --keep-until-expiring -d $${LETSENCRYPT_DOMAIN}",
      ]

  hivemind:
    container_name: avaros-hivemind
    hostname: avaros-hivemind
    build:
      context: hivemind
      dockerfile: Dockerfile
    restart: unless-stopped

    depends_on:
      avaros_skill:
        condition: service_healthy

    networks:
      - ovos

    ports:
      - "${HIVEMIND_PORT:-5678}:5678"

    env_file:
      - ../.env

    environment:
      # HIVEMIND_MASTER_KEY comes from env_file (.env) — do NOT redeclare
      # here or compose shell-variable resolution overrides .env with empty.
      - OVOS_BUS_HOST=${OVOS_BUS_HOST:-ovos_messagebus}
      - OVOS_BUS_PORT=${OVOS_BUS_PORT:-8181}
      - HIVEMIND_WS_PORT=${HIVEMIND_WS_PORT:-5678}
      # Client credentials and allowed_types come from env_file (.env).
      # When .env is absent, entrypoint.sh auto-generates random credentials.
      - HIVEMIND_CLIENT_ALLOWED_TYPES=${HIVEMIND_CLIENT_ALLOWED_TYPES:-recognizer_loop:utterance,recognizer_loop:record_begin,recognizer_loop:record_end,recognizer_loop:audio_output_start,recognizer_loop:audio_output_end,recognizer_loop:b64_transcribe,speak,speak:b64_audio,enclosure.mouth.text,mycroft.skill.handler.start,mycroft.skill.handler.complete,mycroft.audio.service.queue,mycroft.audio.service.play,mycroft.audio.service.stop,mycroft.audio.service.pause,mycroft.audio.service.resume,ovos.common_play.SEI.get.response}

    volumes:
      - hivemind_data:/home/hivemind/.config/hivemind-core
      - hivemind_state:/home/hivemind/.local/share

    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',5678)); s.close(); print('OK')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  avaros-proxy:
    container_name: avaros-proxy
    hostname: avaros-proxy
    image: nginx:1.25-alpine
    restart: unless-stopped

    depends_on:
      avaros-web-ui:
        condition: service_healthy

    networks:
      - ovos

    ports:
      - "${AVAROS_HTTPS_PORT:-443}:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt_certs:/etc/letsencrypt:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "-q", "https://127.0.0.1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

# External network created by WASABI OVOS stack
networks:
  ovos:
    external: true

volumes:
  avaros_pgdata:
    driver: local
  hivemind_data:
    driver: local
  hivemind_state:
    driver: local
  certbot_webroot:
    driver: local
  letsencrypt_certs:
    driver: local
