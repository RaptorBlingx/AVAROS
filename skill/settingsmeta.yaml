skillMetadata:
  name: AVAROS
  author: AVAROS Project
  description: AI Voice Assistant for Manufacturing KPIs - Provides voice-based access to energy, material, production, and carbon metrics.
  license: Apache-2.0
  tags:
    - manufacturing
    - kpi
    - energy
    - sustainability
    - iot
  version: 0.1.1
  
sections:
  - name: Platform Configuration
    fields:
      - name: platform_type
        type: select
        label: Manufacturing Platform
        value: custom_rest
        options:
          - value: custom_rest
            label: Custom REST API
          # Future platforms added here
        helpText: Select your manufacturing data platform. Configure connection details below.
      
      - name: api_url
        type: text
        label: API URL
        value: ""
        placeholder: "https://api.example.com"
        helpText: The base URL for your platform's API
        
      - name: api_key
        type: password
        label: API Key
        value: ""
        placeholder: "Enter your API key"
        helpText: Authentication key for the platform API (stored encrypted)

  - name: Voice Response Settings
    fields:
      - name: response_verbosity
        type: select
        label: Response Detail Level
        value: normal
        options:
          - value: brief
            label: Brief (just the numbers)
          - value: normal
            label: Normal (value with context)
          - value: detailed
            label: Detailed (includes recommendations)
        helpText: How much detail to include in voice responses
        
      - name: units_system
        type: select
        label: Units System
        value: metric
        options:
          - value: metric
            label: Metric (kWh, kg, °C)
          - value: imperial
            label: Imperial (BTU, lb, °F)
        helpText: Measurement units for voice responses

  - name: PREVENTION Analytics
    fields:
      - name: prevention_url
        type: text
        label: PREVENTION URL
        value: ""
        placeholder: "http://prevention:8081"
        helpText: Base URL of the PREVENTION GraphQL service. Leave empty to disable anomaly and drift analytics.

      - name: prevention_auth_token
        type: password
        label: PREVENTION Auth Token
        value: ""
        placeholder: "Bearer token for protected PREVENTION deployments"
        helpText: Optional pre-issued bearer token for protected PREVENTION deployments.

      - name: prevention_auth_mode
        type: select
        label: PREVENTION Auth Mode
        value: "none"
        options:
          - value: none
            label: No authentication
          - value: bearer
            label: Bearer token
          - value: keycloak_client_credentials
            label: Keycloak/OIDC client credentials
        helpText: Authentication mode for PREVENTION. Local development deployments commonly use no authentication.

      - name: prevention_keycloak_token_url
        type: text
        label: PREVENTION Keycloak Token URL
        value: ""
        placeholder: "https://keycloak.example.com/realms/wasabi/protocol/openid-connect/token"
        helpText: Token endpoint for Keycloak/OIDC client-credentials authentication.

      - name: prevention_keycloak_client_id
        type: text
        label: PREVENTION Keycloak Client ID
        value: ""
        placeholder: "avaros-prevention-client"
        helpText: Client ID assigned by the PREVENTION or Keycloak administrator.

      - name: prevention_keycloak_client_secret
        type: password
        label: PREVENTION Keycloak Client Secret
        value: ""
        placeholder: "Client secret"
        helpText: Client secret assigned by the PREVENTION or Keycloak administrator.

      - name: prevention_keycloak_scope
        type: text
        label: PREVENTION Keycloak Scope
        value: ""
        placeholder: "openid"
        helpText: Optional OAuth scope for PREVENTION token requests.

      - name: prevention_data_max_age_minutes
        type: number
        label: PREVENTION Data Freshness Limit (minutes)
        value: 1440
        placeholder: "1440"
        helpText: Mark PREVENTION input data as stale when the export manifest is older than this threshold.

  - name: Default Assets
    fields:
      - name: default_asset
        type: text
        label: Default Asset/Line
        value: "Line-1"
        placeholder: "Line-1"
        helpText: Default asset used when none specified in query
