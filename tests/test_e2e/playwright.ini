[pytest]
# Playwright + AVAROS E2E test configuration
# Run only Playwright tests from this file:
#   pytest tests/test_e2e/test_wizard_playwright.py -v
#   pytest tests/test_e2e/test_wizard_playwright.py -v --headed   # show browser
#   pytest tests/test_e2e/test_wizard_playwright.py -v -k "Mock"  # only mock flow

# Browser settings (override via env or CLI)
# --browser chromium|firefox|webkit
# --headed  (show browser window)
# --slowmo 500  (slow down actions by 500ms for debugging)
