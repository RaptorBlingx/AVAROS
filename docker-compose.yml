# AVAROS Docker Compose - STANDALONE Mode
#
# This file runs AVAROS with its OWN bundled ovos-core.
# Use for: CI/CD, demos, or environments without WASABI.
#
# For WASABI integration (development), use instead:
#   docker compose -f docker/docker-compose.avaros.yml up -d
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f avaros # View logs
#   docker compose down           # Stop all services
#
# First run uses UnconfiguredAdapter until platform is configured via Web UI

services:
  # =========================================================================
  # AVAROS Skill Service
  # =========================================================================
  avaros:
    container_name: avaros-skill
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - AVAROS_LOG_LEVEL=${AVAROS_LOG_LEVEL:-INFO}
      - AVAROS_DATA_PATH=/data
      - AVAROS_DATABASE_URL=sqlite:////data/avaros.db
      - MESSAGEBUS_HOST=ovos_messagebus
      - MESSAGEBUS_PORT=8181
      - PREVENTION_URL=${PREVENTION_URL:-}
      - PREVENTION_AUTH_TOKEN=${PREVENTION_AUTH_TOKEN:-}
      - PREVENTION_DATA_MAX_AGE_MINUTES=${PREVENTION_DATA_MAX_AGE_MINUTES:-1440}
      - PREVENTION_EXPORT_MANIFEST_PATH=/opt/avaros/tools/prevention-addon/data/export_manifest.json
      - WAKEWORD_BACKEND_URL=${WAKEWORD_BACKEND_URL:-http://avaros-wakeword:9999}
      # Platform config comes from Web UI, NOT here
    volumes:
      - avaros-data:/data
      - ./tools/prevention-addon/data:/opt/avaros/tools/prevention-addon/data:ro
    # launch_skill.py is a messagebus client; it does not serve HTTP.
    networks:
      - avaros-network
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos-core:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import skill; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.avaros.service=skill"
      - "com.avaros.description=Manufacturing KPI Voice Assistant"

  # =========================================================================
  # OVOS Message Bus (required for ovos-core + HiveMind + AVAROS skill)
  # =========================================================================
  ovos_messagebus:
    container_name: avaros-messagebus
    image: smartgic/ovos-messagebus@sha256:9ecdeb5cd0dafeb0b71db0f1587265da4db3f8e1906d454fa6279556b8f780e2
    restart: unless-stopped
    volumes:
      - ./docker/ovos-messagebus.standalone.conf:/etc/xdg/mycroft/mycroft.conf:ro
    networks:
      - avaros-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',8181), timeout=2); s.close()\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    labels:
      - "com.avaros.service=ovos-messagebus"

  # =========================================================================
  # OVOS Core (Voice Processing)
  # =========================================================================
  ovos-core:
    container_name: avaros-ovos-core
    image: smartgic/ovos-core@sha256:45fa6b3942334e2e4ff90d7e0e5fdfb2415812df10c238f7a31e347f96fcd6f2
    restart: unless-stopped
    # NOTE: upstream ovos_commonqa has a PipelinePlugin.__init__ signature
    # bug in some versions. If ovos-core crashes on startup, pin a known-good
    # image tag instead of :latest. Do NOT monkey-patch container files.
    environment:
      - TZ=${TZ:-UTC}
      - MESSAGEBUS_HOST=ovos_messagebus
      - MESSAGEBUS_PORT=8181
    volumes:
      - ovos-config:/home/ovos/.config/mycroft
      - ./docker/ovos-core.standalone.conf:/etc/xdg/mycroft/mycroft.conf:ro
    networks:
      - avaros-network
    depends_on:
      ovos_messagebus:
        condition: service_healthy
    labels:
      - "com.avaros.service=ovos-core"

  avaros-web-ui:
    container_name: avaros-web-ui
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AVAROS_DATABASE_URL=sqlite:////data/avaros.db
      - HIVEMIND_WS_URL=${HIVEMIND_WS_URL:-auto}
      - HIVEMIND_BACKEND_URL=ws://hivemind:5678/
      - HIVEMIND_CLIENT_NAME=${HIVEMIND_CLIENT_NAME:-avaros-web-client}
      - HIVEMIND_CLIENT_KEY=${HIVEMIND_CLIENT_KEY:-}
      - HIVEMIND_CLIENT_SECRET=${HIVEMIND_CLIENT_SECRET:-}
      - AVAROS_GENERATOR_MAPPING_FILE=/opt/avaros/tools/reneryo-data-generator/mapping_output.json
      - PREVENTION_URL=${PREVENTION_URL:-}
      - PREVENTION_AUTH_TOKEN=${PREVENTION_AUTH_TOKEN:-}
      - PREVENTION_DATA_MAX_AGE_MINUTES=${PREVENTION_DATA_MAX_AGE_MINUTES:-1440}
      - PREVENTION_EXPORT_MANIFEST_PATH=/opt/avaros/tools/prevention-addon/data/export_manifest.json
    volumes:
      - avaros-data:/data
      - ./skill:/opt/avaros/skill:ro
      - ./tools/prevention-addon/data:/opt/avaros/tools/prevention-addon/data:ro
      - ./tools/reneryo-data-generator:/opt/avaros/tools/reneryo-data-generator:ro
    ports:
      - "127.0.0.1:${AVAROS_WEB_PORT:-8080}:8080"
    networks:
      - avaros-network
    depends_on:
      avaros:
        condition: service_healthy
      avaros-wakeword:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.avaros.service=web-ui"
      - "com.avaros.description=Configuration dashboard and same-origin voice proxy"

  avaros-prevention-exporter:
    container_name: avaros-prevention-exporter
    build:
      context: .
      dockerfile: tools/prevention-data-sync/Dockerfile
    restart: unless-stopped
    user: "${AVAROS_SHARED_DB_UID:-1000}:${AVAROS_SHARED_DB_GID:-1000}"
    env_file:
      - .env
    environment:
      - AVAROS_DATABASE_URL=sqlite:////data/avaros.db
      - PREVENTION_EXPORT_OUTPUT=/opt/avaros/tools/prevention-addon/data
      - PREVENTION_EXPORT_DAYS=${PREVENTION_EXPORT_DAYS:-30}
      - PREVENTION_EXPORT_INTERVAL_SECONDS=${PREVENTION_EXPORT_INTERVAL_SECONDS:-900}
      - PREVENTION_EXPORT_PROFILE=${PREVENTION_EXPORT_PROFILE:-}
    command:
      [
        "sh",
        "-c",
        "case \"$${PREVENTION_EXPORT_ENABLED:-true}\" in false|False|0|no|NO) echo 'PREVENTION exporter disabled'; tail -f /dev/null ;; *) python /opt/avaros/tools/prevention-data-sync/exporter.py --daemon --platform generic_rest --days \"$${PREVENTION_EXPORT_DAYS:-30}\" --interval \"$${PREVENTION_EXPORT_INTERVAL_SECONDS:-900}\" --output \"$${PREVENTION_EXPORT_OUTPUT:-/opt/avaros/tools/prevention-addon/data}\" ;; esac",
      ]
    volumes:
      - avaros-data:/data
      - ./tools/prevention-addon/data:/opt/avaros/tools/prevention-addon/data:rw
    networks:
      - avaros-network
    depends_on:
      avaros-web-ui:
        condition: service_started
    labels:
      - "com.avaros.service=prevention-exporter"
      - "com.avaros.description=Continuous platform-to-PREVENTION data export"

  # =========================================================================
  # Wake-word Detection Service (Web UI voice wake trigger)
  # =========================================================================
  avaros-wakeword:
    container_name: avaros-wakeword
    build:
      context: ./services/wakeword
    restart: unless-stopped
    environment:
      # Default phrase support for browser voice testing.
      - WAKEWORD_MODEL=${WAKEWORD_MODEL:-hey_jarvis}
      # Optional custom model path; leave empty to use registry model.
      - WAKEWORD_MODEL_PATH=${WAKEWORD_MODEL_PATH:-}
      - WAKEWORD_MODEL_LABEL=${WAKEWORD_MODEL_LABEL:-hey_jarvis}
      - WAKEWORD_PRELOAD_MODELS=${WAKEWORD_PRELOAD_MODELS:-1}
      # Demo-tuned wake-word detection: one strong frame should fire, while
      # the backend cooldown suppresses duplicate events from the same phrase.
      - WAKEWORD_THRESHOLD=${WAKEWORD_THRESHOLD:-0.25}
      - WAKEWORD_CONFIRMATION_FRAMES=${WAKEWORD_CONFIRMATION_FRAMES:-1}
      - WAKEWORD_DETECTION_COOLDOWN_SECONDS=${WAKEWORD_DETECTION_COOLDOWN_SECONDS:-1.2}
    volumes:
      # Optional mount point for custom trained wake-word models.
      - ${WAKEWORD_MODELS_DIR:-./services/wakeword/models}:/app/models
    networks:
      - avaros-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.avaros.service=wakeword"
      - "com.avaros.description=Browser wake-word detection backend"

  # =========================================================================
  # HiveMind-core (WebSocket Proxy for Voice — DEC-026)
  # =========================================================================
  hivemind:
    container_name: avaros-hivemind
    build:
      context: ./docker/hivemind
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OVOS_BUS_HOST=ovos_messagebus
      - OVOS_BUS_PORT=8181
      - HIVEMIND_WS_PORT=5678
      # HiveMind credentials come from .env via env_file.
      # Do NOT redeclare them here or compose shell defaults can drift from
      # the browser-facing Web UI configuration and break encrypted WS traffic.
    volumes:
      - hivemind-data:/home/hivemind/.config/hivemind-core
    networks:
      - avaros-network
    depends_on:
      ovos-core:
        condition: service_started
      ovos_messagebus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',5678)); s.close(); print('OK')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.avaros.service=hivemind"
      - "com.avaros.description=WebSocket proxy for browser voice clients"

  # =========================================================================
  # Deterministic demo platform (optional)
  # Start with: docker compose --profile demo up -d
  # =========================================================================
  demo-platform:
    container_name: avaros-demo-platform
    profiles: ["demo"]
    build:
      context: ./tools/reneryo-data-generator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AVAROS_DEMO_PORT:-8090}:8090"
    networks:
      - avaros-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      - "com.avaros.service=demo-platform"
      - "com.avaros.description=Deterministic sample manufacturing API"

# =========================================================================
# Networks
# =========================================================================
networks:
  avaros-network:
    name: avaros-network
    driver: bridge

# =========================================================================
# Volumes (Persistent Storage)
# =========================================================================
volumes:
  # SQLite database for settings, audit logs
  avaros-data:
    name: avaros-data
    driver: local

  # OVOS configuration
  ovos-config:
    name: ovos-config
    driver: local

  # HiveMind client database
  hivemind-data:
    name: hivemind-data
    driver: local
